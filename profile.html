<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>BizLink Profile</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;

}


body{

background:#f5f6fa;

}



/* TOP BAR */

.topbar{

height:80px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
box-shadow:0 3px 12px rgba(0,0,0,.1);

}


.logo{

font-size:30px;
font-weight:bold;
color:#F4B400;

}


.back-home{

text-decoration:none;
background:#0A3D91;
color:white;
padding:12px 25px;
border-radius:30px;

}



/* PROFILE */

.profile-card{


width:450px;

max-width:90%;

margin:60px auto;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 8px 25px rgba(0,0,0,.1);

text-align:center;


}



.avatar{


width:110px;

height:110px;

margin:auto;

border-radius:50%;

background:#0A3D91;

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

color:white;


}



h1{


margin-top:20px;

color:#081426;


}



.badge{


display:inline-block;

margin-top:10px;

padding:7px 20px;

border-radius:20px;

background:#2E8B57;

color:white;

font-size:14px;


}



.info{


margin-top:35px;

text-align:left;


}



.info p{


padding:15px;

border-bottom:1px solid #eee;

font-size:17px;


}



.info i{


color:#0A3D91;

width:25px;


}




.market{


display:inline-block;

margin-top:35px;

padding:14px 35px;

background:#F4B400;

color:#081426;

text-decoration:none;

border-radius:30px;

font-weight:bold;


}



.market:hover{


background:#2E8B57;

color:white;


}



/* MOBILE */


@media(max-width:600px){


.topbar{

padding:0 20px;

}


.logo{

font-size:25px;

}


}



</style>


</head>



<body>



<div class="topbar">


<div class="logo">

BizLink

</div>



<a class="back-home" href="/marketplace">

Marketplace

</a>


</div>





<div class="profile-card">



<div class="avatar">

<i class="fa-solid fa-user"></i>

</div>




<h1>

{{ user.name }}

</h1>



<div class="badge">

<i class="fa-solid fa-circle-check"></i>

BizLink Member

</div>





<div class="info">



<p>

<i class="fa-solid fa-envelope"></i>

{{ user.email }}

</p>




<p>

<i class="fa-solid fa-user-tag"></i>

Account Type: {{ user.role }}

</p>




<p>

<i class="fa-solid fa-store"></i>

Customer Account

</p>



</div>





<a class="market" href="/marketplace">

<i class="fa-solid fa-arrow-left"></i>

Back to Marketplace

</a>



</div>



</body>


</html>
