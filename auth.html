<!DOCTYPE html>
<html>

<head>

<title>BizLink Uganda</title>

<meta charset="UTF-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
135deg,
#081426,
#0A3D91,
#2E8B57
);

}


.container{

width:950px;

height:560px;

background:white;

border-radius:25px;

overflow:hidden;

display:flex;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}


.left{

width:45%;

background:#081426;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:40px;

}


.left img{

width:180px;

margin-bottom:20px;

}


.left h1{

font-size:38px;

color:#F4B400;

}


.left p{

margin-top:20px;

line-height:1.7;

}


.right{

width:55%;

padding:50px;

}


h2{

color:#0A3D91;

margin-bottom:30px;

}


input,select{

width:100%;

padding:14px;

margin-bottom:20px;

border:1px solid #ddd;

border-radius:8px;

}


button{

width:100%;

padding:15px;

border:none;

border-radius:8px;

background:#F4B400;

font-size:17px;

font-weight:bold;

cursor:pointer;

}


button:hover{

background:#d89d00;

}


.switch{

margin-top:20px;

text-align:center;

color:#0A3D91;

cursor:pointer;

}


.form{

display:none;

}


.form.active{

display:block;

}


</style>


</head>


<body>


<div class="container">


<div class="left">


<img src="{{ url_for('static', filename='images/bizlink-logo.png') }}">


<h1>

BizLink Uganda

</h1>


<p>

Connecting Businesses.<br>

Building Futures.

</p>


</div>



<div class="right">


<div id="login" class="form active">


<h2>Login</h2>


<form method="POST" action="/login">


<input

type="email"

name="email"

placeholder="Email"

required>


<input

type="password"

name="password"

placeholder="Password"

required>


<button>

Login

</button>


</form>


<div class="switch" onclick="register()">

No account? Register

</div>


</div>




<div id="register" class="form">


<h2>Create Account</h2>


<form method="POST" action="/register">


<input

name="name"

placeholder="Full Name"

required>



<input

type="email"

name="email"

placeholder="Email"

required>



<input

type="password"

name="password"

placeholder="Password"

required>



<select name="role">


<option value="customer">

Customer

</option>


<option value="merchant">

Merchant

</option>


</select>



<button>

Register

</button>


</form>



<div class="switch" onclick="login()">

Already have account? Login

</div>


</div>



</div>


</div>



<script>


function register(){

document.getElementById("login").classList.remove("active");

document.getElementById("register").classList.add("active");

}



function login(){

document.getElementById("register").classList.remove("active");

document.getElementById("login").classList.add("active");

}


</script>


</body>

</html>
